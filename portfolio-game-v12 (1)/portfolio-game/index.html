<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>John Mark Bautista — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; background: #5D3F2A;
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'VT323', monospace;
  }
  #game-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    background: #5D3F2A;
  }
  #game-container {
    display: flex; align-items: center; justify-content: center;
    line-height: 0;
    border-left: 14px solid #5D3F2A;
    border-right: 14px solid #5D3F2A;
    box-sizing: content-box;
  }
  #game-container canvas { image-rendering: pixelated; display: block; margin: 0 auto; }

  #ui-root {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  #ui-root .retro-window { pointer-events: auto; }

  /* ---- Retro Windows-95-ish window chrome ---- */
  .retro-window {
    position: absolute;
    background: #F4EBDD;
    border: 3px solid #5D3F2A;
    box-shadow: 5px 5px 0 rgba(93,63,42,0.35);
    font-family: 'VT323', monospace;
    color: #3A2E27;
  }
  .retro-titlebar {
    background: linear-gradient(90deg, #E8896A, #F2B138);
    color: #3A2E27;
    padding: 6px 10px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    cursor: default;
  }
  .retro-close {
    background: #fff;
    border: 2px solid #5D3F2A;
    width: 20px; height: 20px;
    cursor: pointer;
    font-size: 11px;
    line-height: 1;
  }
  .retro-close:hover { background: #F08C6C; }
  .retro-body {
    padding: 16px 18px;
    max-height: 60vh;
    overflow-y: auto;
    font-size: 18px;
    line-height: 1.4;
  }
  .retro-h {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #2FB8AC;
    margin: 0 0 8px;
  }
  .retro-meta { font-size: 15px; color: #7A6248; margin: 4px 0; }
  .retro-hr { border: none; border-top: 2px dashed #D9A566; margin: 14px 0; }
  .retro-btn {
    display: inline-block;
    background: #2FB8AC; color: #fff;
    padding: 8px 16px; margin-right: 10px;
    text-decoration: none;
    border: 2px solid #5D3F2A;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
  }
  .retro-btn:hover { background: #F2B138; color: #3A2E27; }

  .desktop-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  .desktop-icon {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; padding: 8px; text-align: center;
  }
  .desktop-icon:hover { background: rgba(242,177,56,0.2); }
  .desktop-icon-glyph {
    width: 36px; height: 36px; background: #2FB8AC; border: 2px solid #5D3F2A;
  }
  .desktop-icon span { font-size: 15px; }

  .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .skill-card { display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 2px solid #D9A566; padding: 8px; }
  .skill-icon { font-size: 20px; }
  .skill-name { font-family: 'Press Start 2P', monospace; font-size: 10px; margin-bottom: 4px; color: #3A2E27; }
  .skill-blurb { font-size: 13px; color: #7A6248; }

  .chapter-block { margin-bottom: 6px; }
  .education-block { display: flex; gap: 14px; align-items: flex-start; }
  .education-logo { width: 56px; height: 56px; object-fit: contain; border: 2px solid #D9A566; background: #fff; padding: 3px; flex-shrink: 0; }
  .contact-links { display: flex; gap: 10px; margin-top: 10px; }

  .about-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 4px; }
  .about-photo { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #5D3F2A; flex-shrink: 0; }
  .cert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .cert-card { background: #fff; border: 2px solid #D9A566; padding: 6px; text-align: center; }
  .cert-thumb { width: 100%; border: 1px solid #D9A566; margin-bottom: 4px; }
  .cert-title { font-size: 12px; font-weight: bold; color: #3A2E27; line-height: 1.2; }
  .cert-issuer { font-size: 11px; color: #7A6248; }

  #mobile-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    padding: 18px;
    pointer-events: none;
    z-index: 50;
  }
  #mobile-controls.visible { display: flex; }
  .mc-dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); gap: 3px; pointer-events: auto; }
  .mc-btn {
    background: rgba(244,235,221,0.85); border: 2px solid #5D3F2A;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #3A2E27; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .mc-btn:active { background: rgba(242,177,56,0.9); }
  .mc-up { grid-column: 2; grid-row: 1; }
  .mc-left { grid-column: 1; grid-row: 2; }
  .mc-right { grid-column: 3; grid-row: 2; }
  .mc-down { grid-column: 2; grid-row: 3; }
  .mc-interact {
    pointer-events: auto;
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(47,184,172,0.85); border: 3px solid #5D3F2A;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace; font-size: 10px; color: #fff;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .mc-interact:active { background: rgba(242,177,56,0.9); }

  .achievements-list { display: flex; flex-direction: column; gap: 8px; }
  .achievement-row { display: flex; gap: 10px; align-items: center; padding: 8px; border: 2px solid #D9A566; background: #fff; }
  .achievement-row.locked { opacity: 0.45; filter: grayscale(1); }
  .achievement-row-icon { font-size: 22px; }
  .achievement-row-title { font-family: 'Press Start 2P', monospace; font-size: 10px; margin-bottom: 3px; }
  .achievement-row-desc { font-size: 13px; color: #7A6248; }

  .achievement-toast {
    position: absolute;
    top: 20px; left: 50%;
    transform: translate(-50%, -30px);
    display: flex; align-items: center; gap: 10px;
    background: #F4EBDD; border: 3px solid #5D3F2A;
    box-shadow: 4px 4px 0 rgba(93,63,42,0.35);
    padding: 10px 16px;
    opacity: 0;
    transition: transform 0.35s ease, opacity 0.35s ease;
    pointer-events: none;
    z-index: 100;
  }
  .achievement-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .achievement-toast-icon { font-size: 26px; }
  .achievement-toast-title { font-family: 'Press Start 2P', monospace; font-size: 9px; color: #2FB8AC; line-height: 1.4; margin-bottom: 6px; }
  .achievement-toast-name { font-size: 16px; color: #3A2E27; line-height: 1.3; }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="game-container" style="position: relative;">
    <div id="ui-root"></div>
    <div id="mobile-controls">
      <div class="mc-dpad">
        <div class="mc-btn mc-up" data-dir="up">^</div>
        <div class="mc-btn mc-left" data-dir="left">&lt;</div>
        <div class="mc-btn mc-right" data-dir="right">&gt;</div>
        <div class="mc-btn mc-down" data-dir="down">v</div>
      </div>
      <div class="mc-interact" id="mc-interact-btn">USE</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<script src="src/data/content.js"></script>
<script src="src/data/media.js"></script>
<script src="src/data/mediaExtra.js"></script>
<script src="src/data/assetData.js"></script>
<script src="src/data/rooms.js"></script>
<script src="src/data/achievements.js"></script>
<script src="src/ui/windowManager.js"></script>
<script src="src/ui/audioManager.js"></script>
<script src="src/ui/achievementSystem.js"></script>
<script src="src/ui/mobileControls.js"></script>
<script src="src/ui/contentRenderers.js"></script>
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/RoomScene.js"></script>
<script src="src/main.js"></script>
</body>
</html>
